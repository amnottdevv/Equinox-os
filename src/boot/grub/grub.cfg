set timeout=0
set default=0

# ============================================================================
#  GRUB config for Equinox OS + .mrp boot modules (English docs).
# ----------------------------------------------------------------------------
#  Every `module` line here is loaded by GRUB at boot, then ingested by
#  kernel_main() via mrp_bootloader_load_modules()
#  (see kernel/library/mrp_bootloader.cpp):
#     *.mrp  -> RAMFS root   (tools: mtcc.mrp, hello.mrp, ...)
#     *.c    -> RAMFS /test  (sample sources for mtcc)
#
#  Module lines are AUTO-GENERATED by the makefile (`make iso` appends one
#  `module /boot/<file>` line for every .mrp and .c found in dist/), so you
#  normally never edit them by hand. To add a new program:
#     1. Build it:   python3 mrp_user/mrp_pack.py mrp_user/hello.cpp dist/hello.mrp
#     2. Rebuild:    make iso    (module line is added automatically)
#
#  VIDEO MODE: start.asm's multiboot header requests 1366x768x32. The
#  gfxpayload chain below gives GRUB explicit fallbacks for hardware/qemu
#  that lacks that exact VBE mode. The kernel reads whatever mode GRUB
#  actually set (vesa_init_from_multiboot) and sizes its console to match.
# ============================================================================
insmod vbe
set gfxpayload=1366x768x32,1280x768x32,1024x768x32,auto

menuentry "Equinox OS" {
    multiboot /boot/kernel.elf
#MODULES_HERE
}
