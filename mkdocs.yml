site_name: Equinox OS
site_description: Equinox Operating System Documentation
site_url: https://amnottdevv.github.io/Equinox-os/
repo_url: https://github.com/amnottdevv/Equinox-os
repo_name: amnottdevv/Equinox-os
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: image/Equinox.png
  favicon: image/Equinox.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: lime
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: lime
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Roboto
    code: JetBrains Mono
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: en

markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/amnottdevv/Equinox-os
  generator: false

copyright: Copyright &copy; 2026 amnottdevv — Equinox OS

nav:
  - Home: index.md
  - Overview:
    - OVERVIEW.md
    - GETTING_STARTED.md
    - INSTALL.md
    - ARCHITECTURE.md
    - RELEASE_NOTES.md
    - Historical Release: Release/0.1_beta.md
    - All Doc Links: nav.md
    - FAQ.md
  - Configuration:
    - CONFIGURATION.md
    - SET.md
    - SYSTEM_ECF.md
    - ECF.md
    - EQSHELL.md
    - COMMANDS.md
  - Storage & Boot:
    - BOOTING.md
    - QFS.md
    - FAT32.md
    - DRIVERS.md
  - Networking:
    - NETWORKING.md
  - Kernel Internals:
    - MEMORY.md
    - MULTITASKING.md
    - SYSCALLS.md
    - GUI.md
  - Self-Hosting:
    - SELF_HOSTING.md
    - MRP.md
    - PACKAGES.md
